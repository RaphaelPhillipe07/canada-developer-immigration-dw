const missingLabel = r => r.id==='PE' ? 'Apenas regional' : 'Indisponível';
const source = 'Statistics Canada, Censo 2021 (tabelas 98-10-0307-01 e 98-10-0258-01) · Job Bank, NOC 21232 (2023–2024)';
function mapColor(r,key,range) {
  if (key==='coverage') return r.salary !== null ? '#007b70' : r.id==='PE' ? '#e4ab62' : '#d4dde2';
  if(r[key] === null) return '#d4dde2';
  const t=(r[key]-range[0])/(range[1]-range[0]);
  return 'rgb('+[248-83*t,233-203*t,232-192*t].map(Math.round).join(',')+')';
}
function renderMap() {
  const key=$('metric').value;
  const values=regions.map(r=>r[key]).filter(n=>Number.isFinite(n));
  const range=[Math.min(...values),Math.max(...values)];
  $('map').innerHTML=regions.map(r=>'<path tabindex="0" role="button" aria-pressed="false" data-id="'+r.id+'" aria-label="'+r.name+' · '+(key==='coverage'?(r.salary!==null?'Publicado':missingLabel(r)):value(r[key],key))+'" d="'+r.shape+'" fill="'+mapColor(r,key,range)+'"></path>').join('')+regions.map(r=>'<text x="'+r.label[0]+'" y="'+r.label[1]+'">'+r.id+'</text>').join('');
  $('legend').innerHTML=key==='coverage'
    ? '<span><i class="swatch" style="background:#007b70"></i>Publicado</span><span><i class="swatch" style="background:#e4ab62"></i>Apenas regional</span><span><i class="swatch" style="background:#d4dde2"></i>Indisponível</span>'
    : '<span>'+value(range[0],key)+'</span><i class="scale"></i><span>'+value(range[1],key)+'</span>'+(values.length<regions.length?'<span><i class="swatch" style="background:#d4dde2"></i>Sem dado</span>':'');
}
function table(headers, rows, caption) {
  return '<table><caption>'+caption+'</caption><thead><tr>'+headers.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map((v,i)=>i?'<td>'+v+'</td>':'<th scope="row">'+v+'</th>').join('')+'</tr>').join('')+'</tbody></table>';
}
function bars(key) {
  const rows=ranked(regions.filter(r=>r[key]!==null),key);
  const max=key==='score'?100:rows[0][key];
  const foot=key==='score'?'<p class="periods">Min–max nas 9 províncias com cobertura completa. Pesos de 1/3 para salário, comunidade e acessibilidade. Menor inacessibilidade recebe maior nota.</p>':'';
  return rows.map(r=>'<button class="row" data-id="'+r.id+'" aria-label="'+r.name+': '+value(r[key],key)+'"><strong>'+r.id+'</strong><span class="track"><span class="bar" style="width:'+(100*r[key]/max)+'%"></span></span><span>'+value(r[key],key)+'</span></button>').join('')+foot;
}
function scatter([x,y,xmid,ymid]) {
  const rows=(x==='people'?provinces:complete);
  const bounds=key=>{
    const all=rows.map(r=>r[key]);
    const lo=Math.min(...all), hi=Math.max(...all), pad=(hi-lo)*.09;
    return [Math.max(0,lo-pad),hi+pad];
  };
  const [xl,xh]=bounds(x),[yl,yh]=bounds(y);
  const X=v=>49+(v-xl)/(xh-xl)*358, Y=v=>211-(v-yl)/(yh-yl)*192;
  const lines=Array.from({length:5},(_,i)=>{
    const h=yl+(yh-yl)*i/4, v=xl+(xh-xl)*i/4;
    return '<path stroke="#dbe5ea" d="M49 '+Y(h)+'H407 M'+X(v)+' 19V211"/><text x="43" y="'+(Y(h)+4)+'" text-anchor="end">'+fmt(h,y==='housing'?1:0)+'</text><text x="'+X(v)+'" y="229" text-anchor="middle">'+fmt(v,x==='salary'?1:0)+'</text>';
  }).join('');
  return '<svg class="plot" viewBox="0 0 430 255" aria-label="'+labels[x]+' por '+labels[y]+'">'+lines+
    (xmid===null?'':'<path stroke="#a54a39" stroke-dasharray="4 4" d="M'+X(xmid)+' 19V211"/>')+
    (ymid===null?'':'<path stroke="#a54a39" stroke-dasharray="4 4" d="M49 '+Y(ymid)+'H407"/>')+
    rows.map(r=>'<circle role="button" tabindex="0" aria-pressed="false" data-id="'+r.id+'" aria-label="'+r.name+' · '+value(r[x],x)+' · '+value(r[y],y)+'" cx="'+X(r[x])+'" cy="'+Y(r[y])+'" r="6"></circle><text pointer-events="none" x="'+(X(r[x])+7)+'" y="'+(Y(r[y])-5)+'">'+r.id+'</text>').join('')+
    '<text x="223" y="249" text-anchor="middle">'+labels[x]+'</text></svg><p class="periods">Eixo vertical: '+labels[y]+'. Linhas tracejadas indicam as medianas usadas na pergunta.</p>';
}
function periodChart(r) {
  const max=Math.max(1,...r.periods);
  return r.periods.map((n,i)=>'<div class="row" style="grid-template-columns:7.7rem 1fr auto"><span>'+periodNames[i]+'</span><span class="track"><span class="bar" style="width:'+100*n/max+'%;background:'+periodColors[i]+'"></span></span><span>'+fmt(n)+'</span></div>').join('')+'<p class="periods">Total oficial: '+fmt(r.people)+'. O arredondamento censitário pode causar diferenças entre esse total e a soma dos períodos.</p>';
}
function renderChart() {
  const chart=slides[page][5];
  const groupStats=(name,g)=>[name,value(median(g.map(r=>r.salary)),'salary'),value(median(g.map(r=>r.housing)),'housing'),g.filter(r=>r.salary!==null).length+'/5'];
  const content = Array.isArray(chart) ? scatter(chart)
    : chart==='periods' ? periodChart(regions.find(r=>r.id===selected))
    : chart==='groups' ? table(['Grupo','Salário','Moradia','Cobertura'], [groupStats('Cinco maiores',highPeople.slice(0,5)),groupStats('Cinco menores',highPeople.slice(5))], 'Províncias agrupadas pelo total de imigrantes nascidos no Brasil.')
    : chart==='missing' ? table(['Jurisdição','Imigrantes','Moradia','Salário'],missing.map(r=>[r.name,fmt(r.people),value(r.housing,'housing'),missingLabel(r)]),'Cobertura provincial para NOC 21232.')
    : chart==='intro' ? '<ul class="summary"><li>Compare salário mediano, comunidade brasileira e acesso à moradia.</li><li>Selecione uma região no mapa ou na lista. Em cada pergunta, os gráficos mostram o mesmo recorte.</li><li>Use as setas do teclado ou os botões Anterior e Próximo.</li></ul>'
    : chart==='summary' ? '<ul class="summary"><li>Salário: 9 províncias e valores em CAD por hora.</li><li>Censo: 13 jurisdições e resultados de 2021.</li><li>Índice: pesos iguais e cobertura completa.</li><li>Comparações descritivas entre fontes de períodos distintos.</li></ul>'
    : bars(chart);
  $('chart').innerHTML=content;
}
function updateSelection() {
  const r=regions.find(r=>r.id===selected);
  $('region').value=selected;
  document.querySelectorAll('[data-id]').forEach(el=>{
    el.classList.toggle('active',el.dataset.id===selected);
    el.setAttribute('aria-pressed',String(el.dataset.id===selected));
  });
  const values=[['Salário mediano',r.salary===null?missingLabel(r):value(r.salary,'salary')],['Imigrantes do Brasil',fmt(r.people)],['Moradia inacessível',value(r.housing,'housing')]];
  if(slides[page][5]==='score') values.push(['Índice combinado',value(r.score,'score')]);
  $('details').innerHTML=values.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+v+'</dd></div>').join('');
}
function selectRegion(id) {
  selected=id;
  if(slides[page][5]==='periods') renderChart();
  updateSelection();
}
function renderPage(focus=false) {
  const [number,title,takeaway,metric,chartTitle,,region]=slides[page];
  selected=region;
  $('slide').classList.toggle('opening',page===0);
  $('progress').style.width=((page+1)/slides.length*100)+'%';
  const [tip,action,target]=guides[page];
  $('guide').hidden=!tip;
  $('guide').innerHTML=tip?'<p><strong>No painel</strong> · '+tip+'</p>'+(action?'<button type="button" data-guide="'+target+'">'+action+'</button>':''):'';
  $('chapter').textContent=/^\d/.test(number)?'Pergunta '+number:number;
  $('title').textContent=title;
  $('takeaway').textContent=takeaway;
  $('metric').value=metric;
  $('chartTitle').textContent=chartTitle;
  $('position').textContent=(page+1)+' / '+slides.length;
  $('previous').disabled=page===0;
  $('next').disabled=page===slides.length-1;
  Array.from($('steps').children).forEach((b,i)=>i===page?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));
  renderMap();renderChart();updateSelection();
  if(focus){$('title').focus({preventScroll:true}); if(window.innerWidth<821) window.scrollTo(0,0);}
}
function navigate(index) {
  if(index<0||index>=slides.length||index===page)return;
  const sectionNode=$('slide');
  sectionNode.classList.remove('enter');
  sectionNode.style.setProperty('--shift',index>page?'16px':'-16px');
  void sectionNode.offsetWidth;
  sectionNode.classList.add('enter');
  page=index;
  const section=page===0?'inicio':page===slides.length-1?'sintese':'pergunta-'+page;
  history.replaceState(null,'','#'+section);
  renderPage(true);
}
$('steps').innerHTML=slides.map(([n,t],i)=>'<button data-slide="'+i+'" title="'+t+'">'+n+'</button>').join('');
$('steps').addEventListener('click',e=>{if(e.target.matches('[data-slide]'))navigate(Number(e.target.dataset.slide));});
$('region').innerHTML=[...regions].sort((a,b)=>a.name.localeCompare(b.name)).map(r=>'<option value="'+r.id+'">'+r.name+'</option>').join('');
$('region').addEventListener('change',e=>selectRegion(e.target.value));
$('metric').addEventListener('change',()=>{renderMap();updateSelection();});
for(const id of ['map','chart']){
  $(id).addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)selectRegion(el.dataset.id);});
  $(id).addEventListener('keydown',e=>{
    if(e.target.tagName.toLowerCase()==='button'||!e.target.dataset.id||!['Enter',' '].includes(e.key))return;
    e.preventDefault();selectRegion(e.target.dataset.id);
  });
}
$('guide').addEventListener('click',e=>{const id=e.target.dataset.guide;if(id)selectRegion(id);});
$('previous').addEventListener('click',()=>navigate(page-1));
$('next').addEventListener('click',()=>navigate(page+1));
document.addEventListener('keydown',e=>{
  if(e.target.closest('select, input, [contenteditable]')||e.altKey||e.ctrlKey||e.metaKey)return;
  if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();navigate(page+(e.key==='ArrowRight'?1:-1));}
});
$('full').hidden=!document.fullscreenEnabled;
$('full').addEventListener('click',async()=>{
  try {if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();} catch { $('full').textContent='Tela cheia indisponível'; }
});
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';});
$('source').innerHTML=source+' · <a href="https://github.com/codeforgermany/click_that_hood/blob/main/public/data/canada.geojson">Geometria do mapa</a>';
const hash=location.hash.match(/^#pergunta-(10|[1-9])$/);
page=hash?Number(hash[1]):location.hash==='#sintese'?slides.length-1:0;
renderPage();
</script>
</html>
