<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia Canadá | TABD</title>
<link rel="stylesheet" href="./index-CCoY-Oa-.css">
<script type="module" src="./index-TABD-8c0cb344.js"></script>
<style>
.presentation-app .presenter-toolbar [aria-label^="Notas do apresentador"],
.presentation-app .presenter-window-launch { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const root = document.getElementById('root');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const pages = ['abertura', 'perguntas', 'metodo', ...Array.from({length: 10}, (_, i) => 'consulta-' + (i + 1)), 'conclusoes'];
let previous = -1;
let animation;
window.addEventListener('keydown', event => {
  if (event.key.toLowerCase() === 'n' && !event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey &&
      root.querySelector('.presentation-app') && !event.target?.closest?.('input, textarea, select, [contenteditable]')) event.preventDefault();
}, {capture: true});
new MutationObserver(() => {
  const deck = root.querySelector('.presentation-app');
  const main = deck?.querySelector('main');
  const current = pages.findIndex(page => deck?.classList.contains('presentation-page-' + page));
  if (!main || current < 0) { animation?.cancel(); previous = -1; return; }
  if (current === previous) return;
  const from = previous;
  previous = current;
  animation?.cancel();
  if (from < 0 || reducedMotion.matches || typeof main.animate !== 'function') return;
  const offset = current > from ? 16 : -16;
  animation = main.animate([
    {opacity: 0, transform: 'translateX(' + offset + 'px)'},
    {opacity: 1, transform: 'translateX(0)'}
  ], {duration: 280, easing: 'cubic-bezier(.2,.7,.3,1)'});
}).observe(root, {childList: true, subtree: true, attributes: true, attributeFilter: ['class']});
reducedMotion.addEventListener?.('change', () => { if (reducedMotion.matches) animation?.cancel(); });
</script>
</body>
</html>
